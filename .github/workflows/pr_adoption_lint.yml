name: PR adoption lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Check Agent adoption section on feat: PRs"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          # Enforce when the PR *title* is feat:, OR when any COMMIT in it is.
          #
          # The title alone was the old rule, and it silently exempted the
          # entire v2.0.0 feature set: those PRs carried prose titles
          # ("Collapse the phase chain to five phases…") over `feat(456):`
          # commits. `scripts/gen-changelog.ts` classifies by commit subject,
          # so the release notes rendered a Features section for work CI had
          # never asked to document. Two definitions of "a feature", and the
          # laxer one guarded the gate.
          needs_section=no
          case "$PR_TITLE" in
            feat:*|"feat("*) needs_section=yes ;;
          esac

          if [ "$needs_section" = no ]; then
            if gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
                 --jq '.[].commit.message | split("\n")[0]' \
               | grep -qE '^feat(\([^)]+\))?!?:'; then
              needs_section=yes
              echo "A commit in this PR is feat: — section required even though the title is not."
            fi
          fi

          if [ "$needs_section" = no ]; then
            echo "No feat: title and no feat: commit — section optional. Skipping check."
            exit 0
          fi

          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"

          if ! grep -qE '^## Agent adoption\b' "$body_file"; then
            echo "::error::feat: PR is missing the '## Agent adoption' section in its body."
            echo "::error::See CONTRIBUTING.md#agent-adoption for the convention."
            exit 1
          fi

          # Require at least one ```prompt fenced block somewhere after the heading.
          # awk extracts everything from the heading onwards; grep looks for the fence.
          if ! awk '/^## Agent adoption/{p=1} p' "$body_file" | grep -qE '^```prompt[[:space:]]*$'; then
            echo "::error::feat: PR has '## Agent adoption' but no \`\`\`prompt fenced block under it."
            echo "::error::See CONTRIBUTING.md#agent-adoption for the format."
            exit 1
          fi

          echo "Agent adoption section present ✓"
